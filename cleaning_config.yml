# ============================================================
# cleaning_config.yml (Report Dashboard project)
#
# Trimmed from the original DATA MIGRATION project's config: this project
# reads raw data from Postgres (IPAYDATA/iPayHub_Data) and writes cleaned
# data back to Postgres (ipaydata_clean/ipayhubdata_clean) exclusively --
# see Codes/postgres_pipeline.py -- so the original file's raw_data_source/
# output_destination sections (S3/local CSV toggles) are omitted entirely
# rather than carried over unused. cleaning_functions.load_cleaning_config()
# treats both as optional (skips their validation if absent), so this is
# safe. Everything below (shared_mappings, shared_transformations,
# timezone_normalization, tables, business_reporting) is unchanged from the
# original project -- it is the single source of truth for both
# Codes/cleaning_functions.py's clean_data()/normalize_timezones() AND
# sql/003_business_report_mv.sql's hand-translated SQL equivalent. If either
# is ever changed, update both.
# ============================================================

