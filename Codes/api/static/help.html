<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iSend Dashboard — Help &amp; Documentation</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- marked (Markdown -> HTML) + mermaid (renders the ```mermaid fences in
     WORKFLOW.md/DASHBOARD_GUIDE.md as actual diagrams) -- CDN-loaded, pinned
     versions, same pattern interactive_dashboard_template.html already uses
     for Plotly. No build step in this project; this page follows suit. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
  /* Same "cloud" palette as login.html / the dashboard's default theme, so
     this reads as part of the same product, not a bolted-on docs site. */
  :root {
    --bg: #e8edf5;
    --card-bg: rgba(255, 255, 255, 0.92);
    --card-border: rgba(30, 41, 59, 0.10);
    --text-main: #1e293b;
    --text-muted: #5b6b82;
    --accent: #4f46e5;
    --accent-dark: #3730a3;
    --accent-glow: rgba(79, 70, 229, 0.18);
    --code-bg: #f1f5f9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    background-color: var(--bg);
    background-image:
      radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.12) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.10) 0px, transparent 50%);
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 1rem 1.75rem;
    background: rgba(232, 237, 245, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--card-border);
  }
  .header-left { display: flex; align-items: center; gap: 0.85rem; }
  .header-left svg { width: 108px; height: auto; flex-shrink: 0; }
  .header-left h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }

  nav.help-nav { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }
  nav.help-nav a {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    text-decoration: none;
    padding: 0.45rem 0.9rem;
    border-radius: 8px;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  nav.help-nav a:hover { background: var(--accent-glow); color: var(--accent-dark); }
  nav.help-nav a.back { color: #fff; background: var(--accent); }
  nav.help-nav a.back:hover { background: var(--accent-dark); }

  main { max-width: 880px; margin: 0 auto; padding: 2rem 1.75rem 5rem; }

  .doc-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 2rem 2.25rem;
    margin-bottom: 2.5rem;
    box-shadow: 0 10px 30px -10px rgba(30, 41, 59, 0.10);
    scroll-margin-top: 5rem; /* so #anchor jumps land below the sticky header */
  }

  .doc-content h1 { font-size: 1.5rem; margin-top: 0; border-bottom: 2px solid var(--card-border); padding-bottom: 0.5rem; }
  .doc-content h2 { font-size: 1.2rem; margin-top: 2rem; color: var(--accent-dark); }
  .doc-content h3 { font-size: 1.02rem; margin-top: 1.5rem; }
  .doc-content p, .doc-content li { line-height: 1.65; font-size: 0.93rem; }
  .doc-content code { background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.85em; }
  .doc-content pre:not(.mermaid) { background: var(--code-bg); padding: 1rem; border-radius: 8px; overflow-x: auto; }
  .doc-content pre:not(.mermaid) code { background: none; padding: 0; }
  .doc-content table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.88rem; display: block; overflow-x: auto; }
  .doc-content th, .doc-content td { border: 1px solid var(--card-border); padding: 0.5rem 0.75rem; text-align: left; }
  .doc-content th { background: var(--code-bg); }
  .doc-content a { color: var(--accent); }
  .doc-content .mermaid {
    display: flex;
    justify-content: center;
    margin: 1.5rem 0;
    background: #fff;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 1.25rem;
    overflow-x: auto;
  }
  .loading-note { color: var(--text-muted); font-size: 0.85rem; }

  @media (max-width: 600px) {
    header { padding: 0.85rem 1.1rem; }
    main { padding: 1.5rem 1rem 4rem; }
    .doc-card { padding: 1.5rem 1.25rem; }
  }
</style>
</head>

<!-- Raw Markdown, injected server-side (see Codes/api/main.py's help_page())
     -- type="text/plain" so the browser never tries to parse it as HTML;
     marked.js below reads it as plain text and renders it client-side. -->
<script id="workflow-md" type="text/plain">WORKFLOW_MD_PLACEHOLDER</script>
<script id="guide-md" type="text/plain">DASHBOARD_GUIDE_MD_PLACEHOLDER</script>

<script>
  function renderMarkdownInto(sourceId, targetId) {
    const raw = document.getElementById(sourceId).textContent;
    document.getElementById(targetId).innerHTML = marked.parse(raw);
  }
  renderMarkdownInto('workflow-md', 'workflow-content');
  renderMarkdownInto('guide-md', 'guide-content');

  // marked renders a ```mermaid fence as <pre><code class="language-mermaid">
  // -- mermaid.js instead expects a bare <pre class="mermaid"> holding the
  // raw diagram source, so each one is swapped into that shape here before
  // handing off to mermaid.run(). Without this, the diagram source would
  // just print as inert text.
  document.querySelectorAll('code.language-mermaid').forEach(codeEl => {
    const pre = document.createElement('pre');
    pre.className = 'mermaid';
    pre.textContent = codeEl.textContent;
    codeEl.closest('pre').replaceWith(pre);
  });
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'strict' });
  mermaid.run({ querySelector: '.mermaid' });
</script>
