<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iSend Dashboard — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same palette as interactive_dashboard_template.html's default "cloud"
     theme, so this page reads as part of the same product, not a bolted-on
     login form. */
  :root {
    --bg: #e8edf5;
    --card-bg: rgba(255, 255, 255, 0.82);
    --card-border: rgba(30, 41, 59, 0.10);
    --text-main: #1e293b;
    --text-muted: #5b6b82;
    --accent: #4f46e5;
    --accent-dark: #3730a3;
    --accent-glow: rgba(79, 70, 229, 0.18);
    --error: #b3261e;
    --error-bg: #fdecea;
    --field-border: #c9d3e0;
    --field-bg: #f8fafc;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    background-color: var(--bg);
    background-image:
      radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.12) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.10) 0px, transparent 50%);
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 20px 50px -12px rgba(30, 41, 59, 0.18), 0 4px 12px rgba(30, 41, 59, 0.06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 2.25rem 2rem 2rem;
  }

  .login-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 1.25rem;
  }
  .login-logo svg { width: 148px; height: auto; }

  .login-heading {
    text-align: center;
    margin-bottom: 1.75rem;
  }
  .login-heading h1 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 0 0 0.3rem;
    color: var(--text-main);
  }
  .login-heading p {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin: 0;
  }

  .field {
    margin-bottom: 1.1rem;
  }
  .field label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }
  .field-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .field-input-wrap svg.field-icon {
    position: absolute;
    left: 0.75rem;
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .field input {
    width: 100%;
    padding: 0.65rem 0.75rem 0.65rem 2.4rem;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--text-main);
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input::placeholder { color: #9aa8bc; }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .field input:invalid:not(:placeholder-shown) {
    border-color: var(--error);
  }

  .toggle-password {
    position: absolute;
    right: 0.6rem;
    background: none;
    border: none;
    padding: 0.25rem;
    display: flex;
    cursor: pointer;
    color: var(--text-muted);
    border-radius: 4px;
  }
  .toggle-password:hover { color: var(--text-main); }
  .toggle-password svg { width: 18px; height: 18px; }

  #error {
    display: none;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.82rem;
    color: var(--error);
    background: var(--error-bg);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    margin-bottom: 1rem;
  }
  #error.visible { display: flex; }
  #error svg { width: 16px; height: 16px; flex-shrink: 0; }

  button#submit-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.7rem;
    margin-top: 0.4rem;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button#submit-btn:hover:not(:disabled) { filter: brightness(1.08); }
  button#submit-btn:active:not(:disabled) { transform: translateY(1px); }
  button#submit-btn:disabled { opacity: 0.7; cursor: default; }

  .spinner {
    display: none;
    width: 15px; height: 15px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  button#submit-btn.loading .spinner { display: inline-block; }
  button#submit-btn.loading .btn-label { opacity: 0.85; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  @media (max-width: 420px) {
    .login-card { padding: 1.75rem 1.5rem 1.5rem; }
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">

36.2861C27.9815 36.0325 9.86246 36.0595 9.48163 36.3139Z" fill="#1761AF"/></svg>
  </div>

  <div class="login-heading">
    <h1>iSend Transaction Dashboard</h1>
    <p>Sign in to view transaction reporting</p>
  </div>

  <div id="error" role="alert">
    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>
    <span id="error-text"></span>
  </div>

  <form id="login-form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <div class="field-input-wrap">
        <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M2.5 5.5A1.5 1.5 0 014 4h12a1.5 1.5 0 011.5 1.5v9A1.5 1.5 0 0116 16H4a1.5 1.5 0 01-1.5-1.5v-9zM4 5.5v.379l6 3.6 6-3.6V5.5H4zm12 1.87-5.606 3.364a.75.75 0 01-.788 0L4 7.37V14.5h12V7.37z"/></svg>
        <input id="email" name="email" type="email" placeholder="you@isend.com.sg" required autocomplete="username" autofocus>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="field-input-wrap">
        <svg class="field-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd"/></svg>
        <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
          <svg id="eye-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3.5c-4.14 0-7.66 2.6-9 6.5 1.34 3.9 4.86 6.5 9 6.5s7.66-2.6 9-6.5c-1.34-3.9-4.86-6.5-9-6.5zm0 10.5a4 4 0 110-8 4 4 0 010 8zm0-6.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg>
        </button>
      </div>
    </div>

    <button id="submit-btn" type="submit">
      <span class="spinner"></span>
      <span class="btn-label">Log in</span>
    </button>
  </form>

  <div class="login-footer">
    iSend Transaction Dashboard &middot; <a href="/help" target="_blank" rel="noopener" style="color: var(--accent); text-decoration: none;">Help &amp; Documentation</a>
  </div>
</div>

<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('error');
  const errorText = document.getElementById('error-text');
  const submitBtn = document.getElementById('submit-btn');
  const passwordInput = document.getElementById('password');
  const toggleBtn = document.getElementById('toggle-password');
  const eyeIcon = document.getElementById('eye-icon');

  const EYE_OPEN = eyeIcon.innerHTML;
  const EYE_CLOSED = '<path d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.86-1.86c1.66-1.24 2.95-2.98 3.7-5.02-1.34-3.9-4.86-6.5-9-6.5-1.44 0-2.8.32-4.02.9L3.28 2.22zM10 6.5c.3 0 .59.03.87.09L8.6 8.87A2.5 2.5 0 0110 6.5zm-4.24 1.4L4.1 6.24A9.86 9.86 0 001 10c1.34 3.9 4.86 6.5 9 6.5 1 0 1.96-.15 2.86-.44l-1.4-1.4A4 4 0 018.2 9.3l-2.44-2.4z"/>';

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.innerHTML = isPassword ? EYE_CLOSED : EYE_OPEN;
    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  function showError(message) {
    errorText.textContent = message;
    errorEl.classList.add('visible');
  }
  function hideError() {
    errorEl.classList.remove('visible');
  }
  function setLoading(loading) {
    submitBtn.disabled = loading;
    submitBtn.classList.toggle('loading', loading);
  }

  form.addEventListener('submit', async (evt) => {
    evt.preventDefault();
    hideError();
    setLoading(true);

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: passwordInput.value,
        }),
      });

      if (!res.ok) {
        showError('Invalid email or password.');
        setLoading(false);
        return;
      }

      // Deliberately NOT reset to not-loading here -- the button stays in
      // its loading state through the redirect, since /dashboard's own
      // initial data fetch can itself take a while (see CLAUDE.md's "Two
      // ways to view the dashboard" section on cold-connection warm-up);
      // flipping back to "Log in" here would look like the click did
      // nothing for however long that takes.
      window.location.href = '/dashboard';
    } catch (err) {
      showError('Could not reach the server. Try again.');
      setLoading(false);
    }
  });
</script>
</body>
</html>
